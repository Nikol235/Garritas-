name: garritas-obs-prod

services:
  garritas-prometheus:
    image: prom/prometheus:v3.14.0
    container_name: garritas-prometheus
    restart: unless-stopped
    ports:
      - "29090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - garritas-prod-net

  garritas-loki:
    image: grafana/loki:3.7.6
    container_name: garritas-loki
    restart: unless-stopped
    ports:
      - "23100:3100"
    networks:
      - garritas-prod-net

  garritas-promtail:
    image: grafana/promtail:3.6.8
    container_name: garritas-promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - ../services:/var/log/garritas:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - garritas-loki
    networks:
      - garritas-prod-net

  garritas-grafana:
    image: grafana/grafana:11.4.0
    container_name: garritas-grafana
    restart: unless-stopped
    ports:
      - "23000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - garritas-prometheus
      - garritas-loki
    networks:
      - garritas-prod-net

networks:
  garritas-prod-net:
    external: true

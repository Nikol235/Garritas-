apiVersion: 1

groups:
  - orgId: 1
    name: garritas-alertas
    folder: Garritas
    interval: 10s
    rules:
      - uid: garritas-instancia-caida
        title: Instancia caida
        condition: B
        for: 1m
        noDataState: NoData
        execErrState: Error
        labels: {}
        annotations:
          summary: "Una instancia registrada en garritas-eureka dejo de responder /actuator/prometheus"
        data:
          - refId: A
            datasourceUid: garritas-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: up{job="garritas-microservicios"}
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
              refId: B

      - uid: garritas-pool-conexiones-alto
        title: Pool de conexiones cerca del limite
        condition: B
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels: {}
        annotations:
          summary: "hikaricp_connections_active / hikaricp_connections_max supero 0.8"
        data:
          - refId: A
            datasourceUid: garritas-prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              expr: hikaricp_connections_active / hikaricp_connections_max
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
                    params: []
              refId: B

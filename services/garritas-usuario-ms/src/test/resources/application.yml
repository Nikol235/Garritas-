server:
  port: 8086
spring:
  application:
    name: garritas-usuario-ms
  cloud:
    config:
      enabled: false
  config:
    import: ""
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:18180/realms/garritas
          jwk-set-uri: http://localhost:18180/realms/garritas/protocol/openid-connect/certs
  datasource:
    url: jdbc:postgresql://localhost:15446/garritas_usuario_db
    username: garritas
    password: garritas
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/demo
  jpa:
    hibernate:
      ddl-auto: validate
eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

